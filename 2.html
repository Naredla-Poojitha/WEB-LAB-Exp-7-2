<html>
<head>
<title>Vehicle Number Validation</title>

<style>
    .error {
        color: red;
        font-size: 12px;
    }
    .success {
        color: green;
        font-size: 12px;
    }
</style>
</head>

<body>

<h3>Vehicle Number Validation</h3>

Enter Vehicle Number:<br>
<input type="text" id="vehicleNumber"><br>
<label id="message"></label><br><br>

<button onclick="validateVehicle()">Check</button>

<script>
function validateVehicle()
{
    var vehicleNumber = document.getElementById("vehicleNumber").value;
    var message = document.getElementById("message");

    var vehiclePattern = /^[A-Z]{2}[0-9]{2}[A-Z]{2}[0-9]{4}$/;

    message.innerHTML = "";

    if(vehicleNumber.match(vehiclePattern))
    {
        message.innerHTML = "Valid Vehicle Number";
        message.className = "success";
    }
    else
    {
        message.innerHTML = "Invalid Vehicle Number";
        message.className = "error";
    }
}
</script>

</body>
</html>
